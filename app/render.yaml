services:
  - type: web
    name: gitora-ai
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn "app:app"

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

      - key: SECRET_KEY
        generateValue: true

      - key: GITHUB_TOKEN
        sync: false

      - key: AI_BASE_URL
        sync: false

      - key: AI_API_KEY
        sync: false

      - key: AI_MODEL
        sync: false

      - key: AI_TIMEOUT
        value: "120"

      - key: AI_MAX_FILE_CHARS
        value: "16000"

      - key: AI_MAX_CONTEXT_CHARS
        value: "90000"

    disk:
      name: gitora-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1